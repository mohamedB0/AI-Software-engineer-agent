version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_swe_team
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Lets the app container launch sibling sandbox containers on the host Docker daemon.
      # For untrusted/multi-tenant deployments replace this with a dedicated sandbox executor service.
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app

volumes:
  pgdata:
